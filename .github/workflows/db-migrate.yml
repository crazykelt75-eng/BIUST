# Database administration: PostGIS, migrations, deny-all RLS, zone seed.
#
# Runs scripts/db-migrate.sh on a GitHub runner. Deliberately does NOT touch
# Cloudflare — no wrangler, no CLOUDFLARE_API_TOKEN, no worker secrets. Code
# deployment is handled entirely by Cloudflare Workers Builds (git-connected,
# configured in the Cloudflare dashboard — see DEPLOYMENT.md), which needs no
# credential in this repository.
#
# Manual only. Run it after provisioning a new database, or after adding a
# migration under prisma/migrations. An ordinary push does not need it — the
# checks it runs are idempotent, but there is no reason to spend a database
# connection on every commit when only schema changes require one.
#
# Requires these repository secrets (Settings → Secrets and variables →
# Actions → New repository secret):
#
#   DATABASE_URL           runtime connection string (kraal_app via the pooler)
#   DIRECT_URL             migrations connection string (postgres, ?schema=kraal)
#   SUPABASE_ACCESS_TOKEN  optional — lets a failed connection repair itself
#                          (scripts/db-bootstrap.py). Grants full control of
#                          every project on the account; remove it once
#                          credentials are settled.
#
# OTP_PEPPER and the other worker runtime secrets are NOT needed here — they
# are set once in the Cloudflare dashboard under the Worker's Settings →
# Variables and Secrets, not by this workflow.

name: Database migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure psql is present
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Administer the database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SEED_ADMIN_PHONE: "71000000"
        run: ./scripts/db-migrate.sh
