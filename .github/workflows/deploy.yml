# FULL manual fallback: database administration + Cloudflare deploy, in one
# run, needing a Cloudflare API token.
#
# NOT the normal deploy path. Cloudflare Workers Builds deploys code on push
# with no token in this repository (see DEPLOYMENT.md); scripts/db-migrate.sh
# plus the "Database migration" workflow handle schema administration on their
# own, needing only Supabase credentials. This workflow is what to reach for
# if Workers Builds is ever disconnected, or a one-off deploy is needed from
# CI without wrangler already logged in anywhere.
#
# Runs scripts/deploy.sh — the same one-command deploy a laptop would run —
# on a GitHub runner, so no local tooling is needed. Manual only
# (workflow_dispatch); a deploy that happens as a side effect of committing is
# a deploy nobody decided to do, and Workers Builds already owns that trigger.
#
# Requires these repository secrets (Settings → Secrets and variables →
# Actions → New repository secret):
#
#   DATABASE_URL           runtime connection string (kraal_app via the pooler)
#   DIRECT_URL             migrations connection string (postgres, ?schema=kraal)
#   OTP_PEPPER             random secret, 16+ chars
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template token
#   CLOUDFLARE_ACCOUNT_ID  optional — only needed if the token spans accounts
#   SUPABASE_ACCESS_TOKEN  optional — see the bootstrap step below. It grants
#                          full control of every project on the account, so
#                          remove it once the credentials are settled.

name: Deploy (full, manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure psql is present
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      # scripts/db-bootstrap.py is NOT run here. deploy.sh invokes it only when
      # a connection actually fails: ALTER ROLE invalidates the pooler's cached
      # credentials, so repairing a password that was already correct provokes
      # the failure the repair is meant to prevent.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEED_ADMIN_PHONE: "71000000"
        run: ./scripts/deploy.sh
