<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
        }
        canvas {
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <canvas id="pong" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const context = canvas.getContext('2d');

        // Create the pong paddle
        const paddleWidth = 10, paddleHeight = 70;
        const player = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: 'white',
            score: 0,
        };

        const computer = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: 'white',
            score: 0,
        };

        // Create the pong ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            speed: 5,
            velocityX: 5,
            velocityY: 5,
            color: 'white',
        };

        // Draw the rectangle
        function drawRect(x, y, w, h, color) {
            context.fillStyle = color;
            context.fillRect(x, y, w, h);
        }

        // Draw the circle
        function drawCircle(x, y, radius, color) {
            context.fillStyle = color;
            context.beginPath();
            context.arc(x, y, radius, 0, Math.PI * 2, false);
            context.closePath();
            context.fill();
        }

        // Draw the text
        function drawText(text, x, y, color) {
            context.fillStyle = color;
            context.font = '45px Arial';
            context.fillText(text, x, y);
        }

        // Reset the ball
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = -ball.velocityX;
            ball.speed = 5;
        }

        // Update the canvas
        function update() {
            // Move the paddle
            document.addEventListener('mousemove', (event) => {
                player.y = event.clientY - paddleHeight / 2;
                player.y = Math.max(0, Math.min(canvas.height - paddleHeight, player.y));
            });

            // Move the computer paddle
            if (ball.y - ball.radius < computer.y) {
                computer.y -= 4;
            } else if (ball.y + ball.radius > computer.y + computer.height) {
                computer.y += 4;
            }

            // Update ball position
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Ball collision with top and bottom
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
            }

            // Ball collision with paddles
            let paddle = (ball.x < canvas.width / 2) ? player : computer;
            if (ball.x - ball.radius < paddle.x + paddle.width && ball.x + ball.radius > paddle.x &&
                ball.y - ball.radius < paddle.y + paddle.height && ball.y + ball.radius > paddle.y) {
                ball.velocityX = -ball.velocityX;
            }

            // Update scores
            if (ball.x - ball.radius < 0) {
                computer.score++;
                resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                resetBall();
            }
        }

        // Render the game
        function render() {
            drawRect(0, 0, canvas.width, canvas.height, 'black');
            drawRect(player.x, player.y, player.width, player.height, player.color);
            drawRect(computer.x, computer.y, computer.width, computer.height, computer.color);
            drawCircle(ball.x, ball.y, ball.radius, ball.color);
            drawText(player.score, canvas.width / 4, canvas.height / 5, 'white');
            drawText(computer.score, 3 * canvas.width / 4, canvas.height / 5, 'white');
        }

        // Game loop
        function game() {
            update();
            render();
            requestAnimationFrame(game);
        }

        game();
    </script>
</body>
</html>
